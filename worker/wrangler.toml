name = "abvx-shortener"
main = "src/index.ts"
compatibility_date = "2026-01-27"

# Add your account_id if you want (optional; wrangler can infer after login)
# account_id = "..."

kv_namespaces = [
  { binding = "LINKS", id = "e35819886430430a992b4b73b0d6c6ea" }
]

[vars]
# Used for building shortUrl in API responses.
BASE_URL = "https://go.abvx.xyz"

# Rate limit (per IP and per API key) for POST /api/shorten.
RATE_LIMIT_WINDOW_SEC = 60
RATE_LIMIT_MAX = 30

# V0.2 security controls.
ALLOW_NO_ORIGIN = "false"
ALLOWED_ORIGINS = ""
STRIP_TRAILING_SLASH = "true"
MAX_URL_LENGTH = 2048
DEFAULT_TTL_SECONDS = 0
